backend:
  name: git-gateway
  branch: main

# Gør at billeder, du uploader i CMS'et, gemmes i dette repo under /assets/img
media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "forside"
    label: "Forside"
    files:
      - name: "home"
        label: "Forside indhold"
        file: "content/home.json"
        fields:
          - { label: "Hero-billede", name: "hero_image", widget: "image" }
          - { label: "Lille tekst over overskrift", name: "hero_kicker", widget: "string" }
          - { label: "Undertekst", name: "hero_title", widget: "string" }
          - { label: "Ejendommens navn", name: "property_name", widget: "string" }
          - { label: "Adresse", name: "address", widget: "string" }
          - { label: "Status-overskrift (fx 'Alle lejligheder er udlejet')", name: "status_heading", widget: "string" }
          - { label: "Status-tekst", name: "status_text", widget: "text" }
          - { label: "Kontakt-email", name: "email", widget: "string" }
          - { label: "Knap-tekst", name: "cta_text", widget: "string" }
          - { label: "Intro-overskrift", name: "intro_heading", widget: "string" }
          - label: "Lejligheds-beskrivelser"
            name: "apartment_summaries"
            widget: "list"
            field: { label: "Tekst", name: "line", widget: "text" }
          - { label: "Overskrift for 'Inkluderer'", name: "includes_heading", widget: "string" }
          - label: "Inkluderer (punktliste)"
            name: "includes"
            widget: "list"
            field: { label: "Punkt", name: "item", widget: "string" }
          - { label: "Overskrift for lejlighedsoversigt", name: "listing_heading", widget: "string" }
          - label: "Lejligheder"
            name: "listings"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - label: "Billeder"
                name: "images"
                widget: "list"
                field: { label: "Billede", name: "image", widget: "image" }
          - { label: "Firmanavn (footer)", name: "company_name", widget: "string" }
          - label: "Adresse i bunden (linjer)"
            name: "footer_address_lines"
            widget: "list"
            field: { label: "Linje", name: "line", widget: "string" }

  - name: "om_os"
    label: "Om os"
    files:
      - name: "om-os"
        label: "Om os-side"
        file: "content/om-os.json"
        fields:
          - { label: "Overskrift", name: "heading", widget: "string" }
          - { label: "Brødtekst", name: "body", widget: "text" }
          - { label: "Kontakt-email", name: "email", widget: "string" }

  - name: "kontakt"
    label: "Kontakt"
    files:
      - name: "kontakt"
        label: "Kontaktside"
        file: "content/kontakt.json"
        fields:
          - { label: "Overskrift", name: "heading", widget: "string" }
          - { label: "Introtekst", name: "intro", widget: "text" }
          - { label: "Kontakt-email", name: "email", widget: "string" }
          - label: "Adresse (linjer)"
            name: "address_lines"
            widget: "list"
            field: { label: "Linje", name: "line", widget: "string" }
