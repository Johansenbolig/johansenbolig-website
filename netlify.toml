[build]
  publish = "."
  # Spring udgivelsen over, når kun admin/indstillinger.json er ændret
  # (rettelser fra redigeringspanelet læses direkte fra GitHub) – sparer credits
  ignore = "bash admin/netlify-ignore.sh"

# Mailværktøjet ligger i repo'et, men må ikke kunne hentes fra hjemmesiden
[[redirects]]
  from = "/mailvaerktoej/*"
  to = "/"
  status = 404
  force = true

# Gamle sider fra den tidligere hjemmeside sendes videre til den nye forside
[[redirects]]
  from = "/om-os.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/kontakt.html"
  to = "/"
  status = 301

[[headers]]
  for = "/billeder/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
